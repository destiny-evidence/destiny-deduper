decision_threshold: 0.85

thresholds:
  doi_partial_match: 0.90
  partial_title_match: 0.90

  title:
    veto: 0.7
    similarity: 0.95
    similarity_lower: 0.75
    partial_match_ratio: 0.9

  author:
    similarity: 0.92
    first_chars: 7

  journal:
    similarity: 0.70
    strong_similarity: 0.92
    abbreviation: 0.70

  paper:
    match: 0.90

  strong_metadata_match: 0.97
  min_mismatches_for_veto: 2

weights:
  doi: 5.304259
  title: 11.591445
  authors: 3.704393
  year: 2.646572
  journal: 3.179915
  pages: 3.791240
  issue: 1.153251
  intercept: -18.688678

patterns:
  html_tag: "<[^>]+>"
  non_alphanumeric: "[^a-z0-9\\s]"
  journal_punctuation: "[^\\w\\s]"
  part_number: "\\bpart\\s+(\\d+|[ivxlcdmIVXLCDM]+)\\b"
  numeric_digits: "\\d+(?:\\.\\d+)?"

roman_numerals:
  i: 1
  v: 5
  x: 10
  l: 50
  c: 100
  d: 500
  m: 1000

