name: Tests
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
    if: github.event.pull_request.draft == false
    env:
      # Configure a constant location for the uv cache
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
          cache: ""

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install the project
        run: uv sync --locked --all-extras --all-groups

      - name: Run test with pytest
        run: uv run pytest --cov=destiny_dedupe/ --cov-report=xml

      - name: Code coverage reporting
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: "80 90"

      - name: Add title to coverage markdown file
        run: |
          echo '## deduplication-toolkit Coverage' > deduplication-toolkit-coverage-results.md
          echo '---' >> deduplication-toolkit-coverage-results.md
          cat code-coverage-results.md >> deduplication-toolkit-coverage-results.md

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        if: github.event_name == 'pull_request'
        with:
          header: "deduplication-toolkit Coverage"
          recreate: true
          path: deduplication-toolkit-coverage-results.md

      - name: Minimize uv cache
        run: uv cache prune --ci

  installed-package:
    # Every other job runs from a checkout, where config.yaml is findable and dev
    # dependencies are present. This one imports the built wheel in a clean
    # environment, which is the only way packaging faults surface before release.
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"

      - name: Build both distributions
        # The release builds both, and package-data reaching the sdist is
        # setuptools-version-dependent, so neither is safe to assume.
        run: uv build --out-dir dist

      - name: Write the import probe
        # A script file keeps sys.path[0] at the script's directory; `python -c`
        # would put the current directory there instead.
        run: |
          cat > /tmp/probe.py <<'EOF'
          import destiny_dedupe.config as config
          from destiny_dedupe.dedupe import Deduper

          settings = config.get_settings()
          assert settings.weights.intercept is not None, "config did not load"
          print("resolved from", config.__file__)
          print("intercept =", settings.weights.intercept)
          EOF

      - name: Import each distribution from outside the source tree
        # Run from /tmp so the checkout is not on sys.path, which would import
        # the source rather than the installed distribution.
        working-directory: /tmp
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*; do
            name=$(basename "$artifact")
            echo "::group::$name"
            uv venv "/tmp/venv-$name" --python 3.12
            uv pip install --python "/tmp/venv-$name/bin/python" "$artifact"
            "/tmp/venv-$name/bin/python" /tmp/probe.py
            echo "::endgroup::"
          done
