[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "pytest-cov>=6.2.1",
    "pytest-env (>=1.1.5,<2.0.0)",
    "pytest-mock>=3.14.1",
    "pytest>=8.3.4",
    "ruff>=0.12.0",
]

[project]
authors = [
    {email = "k.hair@ucl.ac.uk", name = "Kaitlyn Hair"},
    {email = "n.loynes@ucl.ac.uk", name = "Nik Loynes"},
]
dependencies = [
    "destiny-sdk>=0.2.2",
    "faker>=37.5.3",
    "jellyfish>=1.2.0",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "mypy>=1.17.1",
    "pandas-stubs>=2.3.2.250926",
    "pandas>=2.3.3",
    "pre-commit>=4.2.0",
    "pydantic-extra-types>=2.10.5",
    "pydantic-settings>=2.10.1",
    "pydantic>=2.11.7",
    "rapidfuzz>=3.14.5",
    "ruff>=0.12.7",
    "scikit-learn>=1.7.2",
    "tqdm>=4.68.3",
]
description = "A suite of tools for deduplicating DESTINY Works"
name = "deduplication-toolkit"
readme = "README.md"
requires-python = ">=3.12.11"
version = "0.1.0"

[tool.mypy]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = ["--color=yes", "--import-mode=importlib", "--verbose"]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["app/migrations/versions/*.py", "docs/*.py"]
fix = true
force-exclude = true
target-version = "py312"
lint.ignore = [
    "ANN003", # kwargs type annotation required
    "ARG002", # kwargs unused
    "COM812", # trailing commas (ruff-format recommended)
    "CPY001", # missing copyright notice
    "D104", # module docstring
    "D203", # no-blank-line-before-class
    "D205", # missing-blank-line-after-summary
    "D212", # multi-line-summary-first-line
    "D403", # forcing upper-case
    "D407", # removed dashes lines under sections
    "D417", # argument description in docstring (unreliable)
    "E501", # let's keep this for now (long lines)
    "FIX002", # implicit trust that TODOs are not trivial, or else they would be fixed
    "ISC001", # simplify implicit str concatenation (ruff-format recommended)
    "TD002", # name for TO DO
    "TD003", # pedantic issue number requester in to dos
]
lint.per-file-ignores = {"notebooks/*.ipynb" = [
    "ANN001", # type annotations not required in notebooks
    "ANN201", # return type not required in notebooks
    "ANN202", # return type not required in notebooks
    "B018", # useless expression (common in notebooks for output)
    "B905", # zip without strict
    "D103", # docstrings not required in notebooks
    "E402", # imports at top of cell
    "EM101", # exception string literals
    "EM102", # exception f-string literals
    "ERA001", # commented-out code
    "F403", # star imports common in notebooks
    "F405", # star import names
    "FBT003", # boolean positional argument
    "N806", # variable name case
    "NPY002", # legacy numpy random
    "PD011", # use to_numpy
    "PD901", # avoid df variable name
    "PLR0911", # too many return statements
    "PLR2004", # magic values
    "PLW0108", # class variable shadows
    "PLW2901", # loop variable redefined
    "PTH103", # use pathlib
    "PTH120", # use pathlib
    "PTH123", # use pathlib
    "RET504", # unnecessary assignment
    "RUF005", # collection literal concatenation
    "T201", # print statements common in notebooks
    "TRY003", # long exception messages
], "tests*" = [
    "ANN001", # No return type annotation
    "ANN201", # No return type annotation
    "ARG001", # Unused function argument
    "D100", # Missing docstring in public module
    "D103", # Missing docstring in public function
    "INP001", # File is part of an implicit namespace package.
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "S101", # Use of `assert` detected,
]}
lint.select = ["ALL"]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = ["classmethod"]

[tool.tomlsort]
all = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
overrides."project.classifiers".inline_arrays = false
overrides."tool.coverage.paths.source".inline_arrays = false
